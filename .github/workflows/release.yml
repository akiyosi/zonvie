name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build-macos:
    name: Build macOS Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe --tags` in build.zig can
          # resolve the version string baked into the binary.
          fetch-depth: 0

      # The project's Swift settings (default MainActor isolation, deployment
      # target 15.7) need Xcode 26; the runner's default is 16.4. Xcode 26
      # ships the Metal compiler as a separate component, missing on Intel.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Install dependencies (Homebrew)
        run: brew install freetype harfbuzz

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build Zig Core (macOS)
        run: zig build -Doptimize=ReleaseFast

      - name: Build macOS App (Release)
        run: |
          xcodebuild -project macos/zonvie.xcodeproj \
            -scheme zonvie \
            -configuration Release \
            -derivedDataPath macos/.derived \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Create macOS DMG
        run: |
          APP_PATH="macos/.derived/Build/Products/Release/zonvie.app"
          DMG_NAME="zonvie-${{ github.ref_name }}-macos-${{ matrix.arch }}.dmg"

          # Create temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R "$APP_PATH" dmg_contents/
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "Zonvie" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "$DMG_NAME"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.arch }}
          path: "*.dmg"

  build-windows:
    name: Build Windows Release (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-windows-gnu
          - arch: arm64
            target: aarch64-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe --tags` in build.zig can
          # resolve the version string baked into the binary.
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build Windows App (Release)
        run: zig build windows -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Create Windows ZIP
        run: |
          ZIP_NAME="zonvie-${{ github.ref_name }}-windows-${{ matrix.arch }}.zip"
          cd windows/zig-out
          zip -r "../../$ZIP_NAME" zonvie.exe
          cd ../..

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ matrix.arch }}
          path: "*.zip"

  build-linux:
    name: Build Linux Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe --tags` in build.zig can
          # resolve the version string baked into the binary.
          fetch-depth: 0

      # Link-time system libraries (build.zig linux step). GTK 4.14+ is a
      # runtime dependency of the released binary as well.
      - name: Install dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgl-dev libegl-dev libgbm-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build Linux App (Release)
        run: zig build linux -Doptimize=ReleaseFast

      # The layout `zonvie --install` writes under $XDG_DATA_HOME, generated
      # by the binary itself, with Exec/Icon made relocatable.
      - name: Create Linux tarball
        run: |
          NAME="zonvie-${{ github.ref_name }}-linux-${{ matrix.arch }}"
          STAGE="$NAME"
          mkdir -p "$STAGE/bin" "$STAGE/share/icons/hicolor/256x256/apps"
          cp linux/zig-out/zonvie "$STAGE/bin/zonvie"
          XDG_DATA_HOME="$PWD/install_data" XDG_CONFIG_HOME="$PWD/install_config" \
            "$STAGE/bin/zonvie" --install
          mkdir -p "$STAGE/share/applications"
          sed -e 's|^Exec="[^"]*"|Exec=zonvie|' \
              -e 's|^Icon=.*|Icon=io.github.akiyosi.zonvie|' \
            install_data/applications/io.github.akiyosi.zonvie.desktop \
            > "$STAGE/share/applications/io.github.akiyosi.zonvie.desktop"
          cp install_data/icons/io.github.akiyosi.zonvie.png \
            "$STAGE/share/icons/hicolor/256x256/apps/io.github.akiyosi.zonvie.png"
          tar -czf "$NAME.tar.gz" "$STAGE"

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ matrix.arch }}
          path: "*.tar.gz"

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release-*'
          path: artifacts/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
