name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        run: brew install freetype harfbuzz

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build Zig Core (macOS)
        run: zig build

      - name: Build macOS App
        run: |
          xcodebuild -project macos/zonvie.xcodeproj \
            -scheme zonvie \
            -configuration Debug \
            -derivedDataPath macos/.derived \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            build

      - name: Stage .app for upload
        run: |
          mkdir -p artifact-staging
          mv macos/.derived/Build/Products/Debug/zonvie.app artifact-staging/

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: zonvie-macos-${{ matrix.arch }}-debug
          path: artifact-staging

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-windows-gnu
          - arch: arm64
            target: aarch64-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Freshness is enforced by the shader-bytecode job below, which can
      # actually regenerate it. Reported here only so the mismatch is visible
      # on the job that consumes the bytecode; stale bytecode is a startup-cost
      # problem, not a correctness one (the renderer falls back to compiling
      # main.hlsl at runtime), so it must not block the build.
      - name: Check shader bytecode freshness (informational)
        continue-on-error: true
        run: python3 windows/shaders/check_shader_hash.py

      - name: Build Windows App
        run: zig build windows -Dtarget=${{ matrix.target }}

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: zonvie-windows-${{ matrix.arch }}-debug
          path: windows/zig-out/zonvie.exe

  # windows/shaders/compiled_shaders.zig is generated output that has to live
  # in the repo: every Windows build here cross-compiles from Linux, where fxc
  # cannot run, so the bytecode cannot be produced at build time. That makes it
  # drift whenever main.hlsl is edited from macOS. This job is the only place
  # with an fxc, so it regenerates and lands the result rather than asking a
  # human to find a Windows machine.
  shader-bytecode:
    name: Shader bytecode
    # A push to a branch of this repo already regenerates and commits, and a
    # GITHUB_TOKEN push does not trigger workflows — so on a same-repo pull
    # request the pull_request run would see the pre-fix tree, fail, and never
    # be re-run. Only fork pull requests, which cannot be fixed by a push, need
    # the pull_request path.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the push case commits back, and only that case needs the
          # branch tip instead of the triggering SHA. Naming head_ref here
          # would break fork pull requests outright: checkout resolves refs
          # against the base repo, where a fork's branch does not exist.
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}

      - name: Put fxc on PATH
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction Stop |
                 Sort-Object FullName | Select-Object -Last 1
          Write-Host "using $($fxc.FullName)"
          Add-Content $env:GITHUB_PATH $fxc.Directory.FullName

      - name: Regenerate bytecode
        working-directory: windows/shaders
        shell: cmd
        run: |
          call compile.bat || exit /b 1
          python generate_zig.py || exit /b 1

      - name: Report
        id: check
        shell: bash
        run: |
          if git diff --quiet -- windows/shaders/compiled_shaders.zig; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bytecode already matches main.hlsl."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Bytecode was stale; regenerated from main.hlsl."
          fi

      # A push to a branch of this repo can be fixed in place. Pushes made with
      # GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Commit regenerated bytecode
        if: steps.check.outputs.changed == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/shaders/compiled_shaders.zig
          git commit -m "chore(windows/shaders): regenerate compiled_shaders.zig"
          git push

      # On a pull request the branch is left alone — a bot commit landing mid
      # review fights with the author's own rebases, and a fork's GITHUB_TOKEN
      # cannot push at all. Hand the file over instead.
      - name: Upload regenerated bytecode
        if: steps.check.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: compiled_shaders-regenerated
          path: windows/shaders/compiled_shaders.zig

      - name: Fail the pull request
        if: steps.check.outputs.changed == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "main.hlsl changed without regenerating compiled_shaders.zig."
          echo "Download the compiled_shaders-regenerated artifact from this run"
          echo "and commit it, or push the branch directly (a push regenerates"
          echo "and commits automatically)."
          exit 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run Zig Tests
        run: zig build test || echo "No tests defined"
