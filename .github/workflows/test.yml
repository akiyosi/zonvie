name: Test Suite

on: [push, pull_request]

env:
  ZIG_VERSION: "0.16.0"
  # One pinned Neovim release for the e2e and GUI jobs, so an upstream
  # release cannot change test results between runs. Stock Neovim: the
  # ext_windows attach option (unmerged upstream PR) is not available, and
  # no CI scenario enables it; external floats use ext_multigrid.
  NVIM_VERSION: "v0.12.5"

jobs:
  # The e2e runner skips every scenario when it finds no nvim;
  # ZONVIE_REQUIRE_NVIM turns that into a failure.
  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nvim.tar.gz" "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-macos-arm64.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/nvim-macos-arm64/bin/nvim" --version
          echo "$RUNNER_TEMP/nvim-macos-arm64/bin" >> "$GITHUB_PATH"
          echo "ZONVIE_TEST_NVIM=$RUNNER_TEMP/nvim-macos-arm64/bin/nvim" >> "$GITHUB_ENV"
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: E2E Tests
        run: zig build e2e --summary all
        env:
          ZONVIE_REQUIRE_NVIM: "1"
        timeout-minutes: 30
      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .zig-cache/
          retention-days: 7

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build (Linux)
        run: zig build
        timeout-minutes: 20
      - name: Build (Windows Target)
        run: zig build windows -Dtarget=x86_64-windows-gnu
        timeout-minutes: 30

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Unit Tests
        run: zig build test
        timeout-minutes: 20

  # The font tests exercise each platform's real shaper: HarfBuzz/FreeType and
  # the Swift font helpers on macOS, DirectWrite on Windows. The ligature
  # fonts are installed at pinned versions, and ZONVIE_REQUIRE_TEST_FONTS turns
  # a missing test font into a failure instead of a silent skip.
  unit-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Homebrew)
        run: brew install freetype harfbuzz pkgconf
      - name: Install test fonts
        run: |
          mkdir -p ~/Library/Fonts
          cd "$RUNNER_TEMP"
          curl -sSfLO https://github.com/microsoft/cascadia-code/releases/download/v2407.24/CascadiaCode-2407.24.zip
          curl -sSfLO https://github.com/tonsky/FiraCode/releases/download/6.2/Fira_Code_v6.2.zip
          curl -sSfLO https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
          unzip -j -o CascadiaCode-2407.24.zip ttf/CascadiaCode.ttf ttf/CascadiaCodeItalic.ttf -d ~/Library/Fonts
          unzip -j -o Fira_Code_v6.2.zip ttf/FiraCode-Regular.ttf ttf/FiraCode-Bold.ttf -d ~/Library/Fonts
          unzip -j -o JetBrainsMono-2.304.zip fonts/ttf/JetBrainsMono-Regular.ttf fonts/ttf/JetBrainsMono-Bold.ttf fonts/ttf/JetBrainsMono-Italic.ttf -d ~/Library/Fonts
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Unit Tests
        run: zig build test --summary all
        env:
          ZONVIE_REQUIRE_TEST_FONTS: "1"
        timeout-minutes: 30

  unit-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test fonts
        shell: pwsh
        run: |
          # Per-user fonts: DirectWrite's system collection lists the files
          # registered under HKCU\...\Fonts.
          $dir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $sets = @(
            @{ Url = "https://github.com/microsoft/cascadia-code/releases/download/v2407.24/CascadiaCode-2407.24.zip"; Files = @("ttf/CascadiaCode.ttf", "ttf/CascadiaCodeItalic.ttf") },
            @{ Url = "https://github.com/tonsky/FiraCode/releases/download/6.2/Fira_Code_v6.2.zip"; Files = @("ttf/FiraCode-Regular.ttf", "ttf/FiraCode-Bold.ttf") },
            @{ Url = "https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip"; Files = @("fonts/ttf/JetBrainsMono-Regular.ttf", "fonts/ttf/JetBrainsMono-Bold.ttf", "fonts/ttf/JetBrainsMono-Italic.ttf", "fonts/ttf/JetBrainsMono-BoldItalic.ttf") }
          )
          $reg = "HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Fonts"
          New-Item -Force $reg -ErrorAction SilentlyContinue | Out-Null
          foreach ($set in $sets) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $set.Url -Leaf)
            Invoke-WebRequest $set.Url -OutFile $zip
            $out = Join-Path $env:RUNNER_TEMP "fonts"
            New-Item -ItemType Directory -Force $out | Out-Null
            tar -xf $zip -C $out @($set.Files)
            foreach ($f in $set.Files) {
              $dst = Join-Path $dir (Split-Path $f -Leaf)
              Copy-Item (Join-Path $out $f) $dst -Force
              New-ItemProperty -Path $reg -Name "$([IO.Path]::GetFileNameWithoutExtension($dst)) (TrueType)" -Value $dst -PropertyType String -Force | Out-Null
            }
          }
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Unit Tests
        run: zig build test --summary all
        env:
          ZONVIE_REQUIRE_TEST_FONTS: "1"
        timeout-minutes: 30

  # The GUI driver launches the real Windows app against a headless nvim and
  # observes its windows (EnumWindows, synthesized input, DIB capture).
  # Goldens are not committed: with CI set, a golden-only visual check
  # reports SKIP (visual.assertMatch), so green never rests on one. Those
  # that compare captures within one run, and the behavioural ones, assert. ZONVIE_GUI_REQUIRE turns a missing nvim or app into a failure
  # instead of a skip.
  gui-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "nvim-win64.zip"
          Invoke-WebRequest "https://github.com/neovim/neovim/releases/download/$env:NVIM_VERSION/nvim-win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $nvim = Join-Path $env:RUNNER_TEMP "nvim-win64\bin\nvim.exe"
          & $nvim --version
          Add-Content $env:GITHUB_ENV "ZONVIE_TEST_NVIM=$nvim"
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build Windows app
        run: zig build windows -Dtarget=x86_64-windows-gnu --summary all
        timeout-minutes: 30
      - name: GUI Tests
        run: zig build gui-test --summary all
        env:
          ZONVIE_GUI_REQUIRE: "1"
        timeout-minutes: 40
      - name: Upload GUI test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-windows
          path: |
            tmp/
            test/gui/golden/windows/
          if-no-files-found: ignore
          retention-days: 7

  # The same driver on macOS: CGWindowList, CGEvent input, window capture.
  # As on Windows, golden-only visual checks SKIP on CI (no committed
  # goldens); those that compare captures within one run still assert.
  # Scenarios that need Accessibility skip themselves when the runner does
  # not grant it.
  gui-tests-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Install dependencies (Homebrew)
        run: brew install freetype harfbuzz pkgconf
      - name: Install Neovim
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nvim.tar.gz" "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-macos-arm64.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/nvim-macos-arm64/bin/nvim" --version
          echo "ZONVIE_TEST_NVIM=$RUNNER_TEMP/nvim-macos-arm64/bin/nvim" >> "$GITHUB_ENV"
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build macOS app
        run: |
          zig build
          xcodebuild -project macos/zonvie.xcodeproj \
            -scheme zonvie \
            -configuration Debug \
            -derivedDataPath macos/.derived \
            -destination "platform=macOS,arch=arm64" \
            build
        timeout-minutes: 30
      - name: GUI Tests
        run: zig build gui-test --summary all
        env:
          ZONVIE_GUI_REQUIRE: "1"
        timeout-minutes: 40
      - name: Upload GUI test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-macos
          path: |
            tmp/
            test/gui/golden/macos/
          if-no-files-found: ignore
          retention-days: 7
